<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Crystal ball base -->
  <ellipse cx="32" cy="56" rx="16" ry="4" fill="#3a3a4d"/>
  <!-- Orb gradient -->
  <defs>
    <radialGradient id="g" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="30" r="24" fill="url(#g)"/>
  <!-- Glass shine -->
  <circle cx="32" cy="30" r="24" fill="url(#shine)"/>
  <!-- Small sparkles inside -->
  <circle cx="26" cy="22" r="1.5" fill="#e0e7ff" opacity="0.8"/>
  <circle cx="38" cy="34" r="1" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="30" cy="38" r="1.2" fill="#c4b5fd" opacity="0.5"/>
</svg>
